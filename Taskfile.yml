version: '3'

vars:
  REGISTRY: ghcr.io/ysicing/gitspace-runtime
  BASE_IMAGE: '{{.REGISTRY}}:base-latest'
  TIMESTAMP:
    sh: date -u +'%Y%m%d%H'
  BUILD_DATE:
    sh: date -u +'%Y-%m-%dT%H:%M:%SZ'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  PLATFORMS: linux/amd64
  VSCODE_EXTENSIONS: "yzhang.markdown-all-in-one,ysicing.gaeaflow-welcome,editorconfig.editorconfig,timonwong.shellcheck,shardulm94.trailing-spaces,gruntfuggly.todo-tree,vscode-icons-team.vscode-icons,ms-ceintl.vscode-language-pack-zh-hans,esbenp.prettier-vscode,anthropic.claude-code,openai.chatgpt"

tasks:
  default:
    desc: 显示帮助信息
    cmds:
      - task --list

  test:
    desc: 验证运行时脚本与 Gitness 契约（不构建、不推送镜像）
    cmds:
      - bash verify-consistency.sh

  build-base:
    desc: 构建基础镜像
    cmds:
      - |
        docker buildx build \
          --platform {{.PLATFORMS}} \
          --build-arg BUILD_DATE={{.BUILD_DATE}} \
          --build-arg VCS_REF={{.GIT_COMMIT}} \
          -t {{.REGISTRY}}:base-latest \
          -t {{.REGISTRY}}:base-{{.TIMESTAMP}} \
          -t {{.REGISTRY}}:base-{{.GIT_COMMIT}} \
          -f base/Dockerfile \
          --pull \
          --no-cache \
          --push \
          .

  build-vscode:
    desc: 构建 VSCode Desktop 镜像

    cmds:
      - |
        docker buildx build \
          --platform {{.PLATFORMS}} \
          --build-arg BUILD_DATE={{.BUILD_DATE}} \
          --build-arg VCS_REF={{.GIT_COMMIT}} \
          --build-arg BASE_IMAGE={{.BASE_IMAGE}} \
          --build-arg VSCODE_EXTENSIONS="{{.VSCODE_EXTENSIONS}}" \
          -t {{.REGISTRY}}:vscode-latest \
          -t {{.REGISTRY}}:vscode-{{.TIMESTAMP}} \
          -f vscode/Dockerfile \
          --pull \
          --no-cache \
          --push \
          .

  build-vscode-web:
    desc: 构建 VSCode Web 镜像

    cmds:
      - |
        docker buildx build \
          --platform {{.PLATFORMS}} \
          --build-arg BUILD_DATE={{.BUILD_DATE}} \
          --build-arg VCS_REF={{.GIT_COMMIT}} \
          --build-arg BASE_IMAGE={{.BASE_IMAGE}} \
          --build-arg VSCODE_EXTENSIONS="{{.VSCODE_EXTENSIONS}}" \
          -t {{.REGISTRY}}:vscode-web-latest \
          -t {{.REGISTRY}}:vscode-web-{{.TIMESTAMP}} \
          -f vscode-web/Dockerfile \
          --pull \
          --no-cache \
          --push \
          .

  build-all:
    desc: 构建所有镜像
    cmds:
      - task: build-base
      - task: build-vscode
      - task: build-vscode-web
